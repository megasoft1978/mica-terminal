name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Swift build
        uses: actions/cache@v6
        with:
          path: build/swift-build
          key: swift-${{ runner.os }}-${{ hashFiles('voice/Package.resolved') }}
      - name: Validate tests and app bundle
        run: make validate
      - name: Sanitizer, fuzz and UI stress tests
        run: make sanitize FUZZ_SEEDS=3 && make stress STRESS_SEEDS=3
      - name: Upload AppKit smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mica-ui-smoke
          path: |
            build/ui-smoke.png
            build/ui-smoke-report.txt
          if-no-files-found: ignore
          retention-days: 7
