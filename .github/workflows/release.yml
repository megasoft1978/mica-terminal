name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  existing_release:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check for a locally notarized release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exists=false
          attempt=0
          while [ "$exists" = false ] && [ "$attempt" -lt 12 ]; do
            attempt=$((attempt + 1))
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exists=true
            else
              sleep 5
            fi
          done
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
  release:
    needs: existing_release
    if: needs.existing_release.outputs.exists != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches version
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          expected="v$v"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "tag ${GITHUB_REF_NAME} does not match Info.plist version $v"; exit 1; }
      - name: Require signed-release credentials
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: scripts/check-release-credentials.sh
      - name: Test
        run: make test
      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "$CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p ci ci.keychain
            security default-keychain -s ci.keychain
            security unlock-keychain -p ci ci.keychain
            security import cert.p12 -k ci.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci ci.keychain
            echo "SIGN_ID=$(security find-identity -v -p codesigning ci.keychain | sed -n 's/.*"\(Developer ID Application.*\)"/\1/p' | head -1)" >> "$GITHUB_ENV"
          fi
      - name: Build signed and notarized distribution
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          if [ -z "$SIGN_ID" ] || [ "$SIGN_ID" = "-" ]; then
            echo "::error::No Developer ID identity was imported"
            exit 1
          fi
          xcrun notarytool store-credentials mica-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          make notarize SIGN_ID="$SIGN_ID"
      - name: Verify release checksums
        run: |
          codesign --verify --deep --strict build/Mica.app
          xcrun stapler validate build/Mica.app
          xcrun stapler validate build/Mica.dmg
          cd build && shasum -a 256 -c SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (published from a notarized local build); leaving it."
            exit 0
          fi
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--latest";; esac
          gh release create "$GITHUB_REF_NAME" build/Mica.dmg build/Mica.zip build/SHA256SUMS.txt \
            --title "Mica ${GITHUB_REF_NAME#v}" --generate-notes $flags
